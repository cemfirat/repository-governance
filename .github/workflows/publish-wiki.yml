name: Publish handbook wiki

on:
  workflow_dispatch:
  gollum:
  push:
    paths:
      - "wiki/**"
      - "scripts/validate-wiki-handbook.py"
      - ".github/workflows/publish-wiki.yml"

permissions:
  contents: write

concurrency:
  group: repository-governance-wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate handbook source
        run: python3 scripts/validate-wiki-handbook.py

      - name: Verify GitHub Wiki Git access
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          WIKI_URL="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          TARGET="${RUNNER_TEMP}/repository-governance-wiki-auth-check"
          AUTH_BASIC="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_BASIC}" \
            clone --quiet "${WIKI_URL}" "${TARGET}"
          git -C "${TARGET}" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_BASIC}" \
            push --dry-run origin HEAD >/dev/null

      - name: Publish version-controlled handbook
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          WIKI_URL="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          TARGET="${RUNNER_TEMP}/repository-governance-wiki"
          AUTH_BASIC="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_BASIC}" \
            clone --quiet "${WIKI_URL}" "${TARGET}"

          find "${TARGET}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R wiki/. "${TARGET}/"

          cd "${TARGET}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki already matches the version-controlled handbook."
            exit 0
          fi

          git commit -m "Sync handbook from repository-governance ${GITHUB_SHA}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_BASIC}" \
            push origin HEAD
