name: Validate governance files

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ruleset templates and script
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate JSON syntax
        run: jq empty rulesets/*.json

      - name: Validate WordPress blueprint JSON syntax
        run: find blueprints/wordpress-plugin -name '*.json' -print0 | xargs -0 -r -n1 jq empty

      - name: Validate WordPress blueprint Python syntax
        run: >-
          python3 -m py_compile
          scripts/wordpress-plugin-blueprint.py
          scripts/wordpress-plugin-fleet.py
          scripts/wordpress-plugin-upgrade-plan.py
          scripts/wordpress-plugin-pr-orchestrator.py
          scripts/wordpress-plugin-scaffold.py
          scripts/wordpress-plugin-check-policy.py
          scripts/validate-wiki-handbook.py
          tests/test_wordpress_plugin_blueprint.py
          tests/test_wordpress_plugin_fleet.py
          tests/test_wordpress_plugin_upgrade_plan.py
          tests/test_wordpress_plugin_pr_orchestrator.py
          tests/test_wordpress_plugin_scaffold.py
          tests/test_wordpress_plugin_check_policy.py

      - name: Run WordPress blueprint unit tests
        run: python3 -m unittest discover -s tests -p 'test_wordpress_plugin_*.py' -v

      - name: Validate handbook wiki source
        run: python3 scripts/validate-wiki-handbook.py

      - name: Validate hard guardrails policy
        run: |
          jq -e '
            .enforcement == "active" and
            .target == "branch" and
            .conditions.ref_name.include == ["refs/heads/main"] and
            (.bypass_actors | length) == 0 and
            ([.rules[].type] | sort) == (["deletion", "non_fast_forward"] | sort)
          ' rulesets/main-protection-hard-guardrails.json

      - name: Validate merge gates base policy
        run: |
          jq -e '
            .enforcement == "active" and
            .target == "branch" and
            .conditions.ref_name.include == ["refs/heads/main"] and
            .bypass_actors == [] and
            ([.rules[].type] | sort) == (["pull_request","required_status_checks"] | sort) and
            ([.rules[] | select(.type=="pull_request") | .parameters |
              (.required_approving_review_count==0 and .required_review_thread_resolution==true)] == [true]) and
            ([.rules[] | select(.type=="required_status_checks") | .parameters |
              (.strict_required_status_checks_policy==true and
               (.required_status_checks | length > 0) and
               (all(.required_status_checks[]; .integration_id == 15368)))] == [true])
          ' rulesets/main-protection-merge-gates-base.json

      - name: Validate visibility profiles
        run: |
          for profile in public private; do
            jq -e --arg p "$profile" '.profile==$p and .visibility==$p and (.default_required_checks | length > 0)' "profiles/$profile.json"
          done

      - name: Validate shell syntax
        run: bash -n scripts/apply-rulesets.sh scripts/create-protected-repository.sh

      - name: Test repository ruleset profiles
        run: python3 -m unittest discover -s tests -p 'test_ruleset_profiles.py' -v

      - name: Exercise dry-run without GitHub authentication
        run: |
          bash scripts/apply-rulesets.sh example/repository --profile public --dry-run >/dev/null
          bash scripts/apply-rulesets.sh example/repository --profile private --dry-run >/dev/null
