name: Validate governance files

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Validate ruleset templates and script
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate JSON syntax
        run: jq empty rulesets/*.json

      - name: Validate WordPress blueprint JSON syntax
        run: find blueprints/wordpress-plugin -name '*.json' -print0 | xargs -0 -r -n1 jq empty

      - name: Validate WordPress blueprint Python syntax
        run: >-
          python3 -m py_compile
          scripts/wordpress-plugin-blueprint.py
          scripts/wordpress-plugin-fleet.py
          scripts/wordpress-plugin-upgrade-plan.py
          scripts/wordpress-plugin-pr-orchestrator.py
          scripts/wordpress-plugin-scaffold.py
          scripts/wordpress-plugin-check-policy.py
          tests/test_wordpress_plugin_blueprint.py
          tests/test_wordpress_plugin_fleet.py
          tests/test_wordpress_plugin_upgrade_plan.py
          tests/test_wordpress_plugin_pr_orchestrator.py
          tests/test_wordpress_plugin_scaffold.py
          tests/test_wordpress_plugin_check_policy.py

      - name: Run WordPress blueprint unit tests
        run: python3 -m unittest discover -s tests -p 'test_wordpress_plugin_*.py' -v

      - name: Validate hard guardrails policy
        run: |
          jq -e '
            .enforcement == "active" and
            .target == "branch" and
            .conditions.ref_name.include == ["refs/heads/main"] and
            (.bypass_actors | length) == 0 and
            ([.rules[].type] | sort) == (["deletion", "non_fast_forward"] | sort)
          ' rulesets/main-protection-hard-guardrails.json

      - name: Validate merge gates base policy
        run: |
          jq -e '
            .enforcement == "active" and
            .target == "branch" and
            .conditions.ref_name.include == ["refs/heads/main"] and
            ([.bypass_actors[].actor_id] | sort) == ([2, 5] | sort) and
            any(.rules[]; .type == "pull_request") and
            (all(.rules[]; .type != "deletion" and .type != "non_fast_forward"))
          ' rulesets/main-protection-merge-gates-base.json

      - name: Validate shell syntax
        run: bash -n scripts/apply-rulesets.sh

      - name: Exercise dry-run without GitHub authentication
        run: bash scripts/apply-rulesets.sh example/repository --dry-run >/dev/null
