schema: 1
profile: application

purpose: "Larger WordPress plugins with integrations, application logic or deeper operational requirements."

baseline:
  branding: true
  license: GPL-2.0-or-later
  readme_txt: true
  changelog: true

validation:
  php_syntax: required
  metadata_consistency: required
  package_contents: required
  plugin_check: evaluate
  wordpress_integration: required
  security_regression: recommended
  playground_preview: optional

release:
  deterministic_zip: required
  github_release: optional
  wordpress_update_flow: optional
  release_qualification: recommended

architecture:
  composer: optional
  npm: optional
  docs: recommended
  tests: required
  forced_directories: false
