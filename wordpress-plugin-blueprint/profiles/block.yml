schema: 1
profile: block

purpose: "Plugins centered on WordPress Block Editor functionality."

baseline:
  branding: true
  license: GPL-2.0-or-later
  readme_txt: true
  changelog: true

tooling:
  prefer_official_wordpress_block_scaffold: true

validation:
  php_syntax: required
  metadata_consistency: required
  package_contents: required
  plugin_check: evaluate
  javascript_checks: required_when_javascript_present
  wordpress_integration: recommended
  playground_preview: recommended

release:
  deterministic_zip: required
  github_release: optional
  wordpress_update_flow: optional

architecture:
  do_not_force_classic_php_boilerplate: true
